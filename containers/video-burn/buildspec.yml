# CodeBuild spec for the video-burn image (project padmakara-video-burn-build,
# ARM_CONTAINER, privileged). The source is a zip of the padmakara-api repo
# root made by containers/video-burn/build-on-aws.sh, because the Dockerfile
# needs src/lib/slides/ next to containers/video-burn/.
version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${ECR_URI%%/*}"
  build:
    commands:
      - docker build -f containers/video-burn/Dockerfile -t "$ECR_URI:latest" -t "$ECR_URI:$IMAGE_TAG" .
  post_build:
    commands:
      # A failed build must not push: CodeBuild still runs post_build after a failed build phase.
      - test "$CODEBUILD_BUILD_SUCCEEDING" = "1"
      - docker push "$ECR_URI:$IMAGE_TAG"
      - docker push "$ECR_URI:latest"
